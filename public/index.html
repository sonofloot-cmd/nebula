
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b14">
  <title>Nebula</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>

<body>

<header class="toolbar">

  <div class="brand">
    <span class="logo">✦</span>
    <span>Nebula</span>
  </div>

  <a href="/directory.html">Explore Hub</a>

  <div class="browser-controls">
    <button id="back" type="button" title="Back">←</button>
    <button id="forward" type="button" title="Forward">→</button>
    <button id="refresh" type="button" title="Refresh">↻</button>
    <button id="home" type="button" title="Home">⌂</button>
  </div>

  <form id="address-form">
    <input
      id="address"
      type="text"
      placeholder="Search or enter a website..."
      autocomplete="off"
    >
    <button type="submit">Go</button>
  </form>

</header>

<main id="home-screen">

  <div class="hero">

    <div class="hero-logo">✦</div>

    <h1>Nebula</h1>

    <p>Explore beyond the ordinary.</p>

    <form id="search-form" class="search-box">
      <span>⌕</span>
      <input
        id="search"
        type="text"
        placeholder="Search the internet..."
        autocomplete="off"
      >
      <button type="submit">Search</button>
    </form>

  </div>

  <section id="results" class="results"></section>

</main>

<section id="browser" hidden>

  <div class="viewer-toolbar">

    <div class="viewer-indicator">
      <span class="status-dot"></span>
      <span id="browser-status">Ready</span>
    </div>

    <button id="open-external" type="button">
      Open in new tab ↗
    </button>

  </div>

  <div class="viewer-container">

    <iframe
      id="viewer"
      title="Nebula website viewer"
      allow="fullscreen; autoplay; encrypted-media; picture-in-picture"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

  </div>

</section>

<footer>
  Nebula · Explore beyond the ordinary.
</footer>

</body>
</html>
