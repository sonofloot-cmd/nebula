<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b14">
  <title>Nebula</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>

<body>

<header class="toolbar">
  <div class="brand">
    <span class="logo">✦</span>
    <span>Nebula</span>
  </div>

  <div class="browser-controls">
    <button id="back">←</button>
    <button id="forward">→</button>
    <button id="refresh">↻</button>
    <button id="home">⌂</button>
  </div>

  <form id="address-form">
    <input id="address" placeholder="Search or enter a website...">
    <button type="submit">Go</button>
  </form>
</header>

<main id="home-screen">
  <div class="hero">
    <div class="hero-logo">✦</div>
    <h1>Nebula</h1>
    <p>Explore beyond the ordinary.</p>

    <form id="search-form" class="search-box">
      <span>⌕</span>
      <input id="search" placeholder="Search the internet...">
      <button type="submit">Search</button>
    </form>
  </div>

  <section id="results" class="results"></section>
</main>

<section id="browser" hidden>
  <div id="browser-status" class="browser-status">
    Loading website...
  </div>

 <iframe
  id="viewer"
  title="Nebula website viewer"
  allow="fullscreen; autoplay; encrypted-media; picture-in-picture"
  referrerpolicy="strict-origin-when-cross-origin">
</iframe>
</section>

<footer>Nebula · Explore beyond the ordinary.</footer>

</body>
</html>
